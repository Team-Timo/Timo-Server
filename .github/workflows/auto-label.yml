name: Auto Label

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    # 본문만 수정한 경우에는 라벨을 다시 계산하지 않는다.
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const isIssue = context.eventName === 'issues';
            const item = isIssue
              ? context.payload.issue
              : context.payload.pull_request;

            const title = item.title.toLowerCase();
            const author = item.user.login;

            const labels = new Set();

            const titleRules = [
              {
                label: '✨ feat',
                patterns: [/\[feat\]/, /(?:^|[^a-z0-9])feat:/]
              },
              {
                label: '🛠️ fix',
                patterns: [/\[fix\]/, /(?:^|[^a-z0-9])fix:/]
              },
              {
                label: '🚨 hotfix',
                patterns: [/\[hotfix\]/, /(?:^|[^a-z0-9])hotfix:/]
              },
              {
                label: '📃 docs',
                patterns: [/\[docs\]/, /(?:^|[^a-z0-9])docs:/]
              },
              {
                label: '🔁 refactor',
                patterns: [/\[refactor\]/, /(?:^|[^a-z0-9])refactor:/]
              },
              {
                label: '📝 chore',
                patterns: [/\[chore\]/, /(?:^|[^a-z0-9])chore:/]
              },
              {
                label: '🧪 test',
                patterns: [/\[test\]/, /(?:^|[^a-z0-9])test:/]
              },
              {
                label: '✏️ style',
                patterns: [/\[style\]/, /(?:^|[^a-z0-9])style:/]
              },
              {
                label: '✒️ comment',
                patterns: [/\[comment\]/, /(?:^|[^a-z0-9])comment:/]
              },
              {
                label: '📄 rename',
                patterns: [/\[rename\]/, /(?:^|[^a-z0-9])rename:/]
              },
              {
                label: '♻️ remove',
                patterns: [/\[remove\]/, /(?:^|[^a-z0-9])remove:/]
              },
              {
                label: '⚙️ setting',
                patterns: [/\[setting\]/, /(?:^|[^a-z0-9])setting:/]
              }
            ];

            for (const rule of titleRules) {
              if (rule.patterns.some(pattern => pattern.test(title))) {
                labels.add(rule.label);
              }
            }

            const authorLabels = {
              'Jy000n': '🌸 자윤',
              'aneykrap': '🌵 예나',
              'laura-jung': '🍀️ 윤아'
            };

            const managedLabels = new Set([
              ...titleRules.map(rule => rule.label),
              ...Object.values(authorLabels)
            ]);

            if (authorLabels[author]) {
              labels.add(authorLabels[author]);
            }

            const currentLabels = (item.labels || []).map(label => label.name || label);
            // 바뀐 라벨만 제거·추가해 불필요한 라벨 이벤트와 알림을 만들지 않는다.
            const labelsToRemove = currentLabels.filter(
              label => managedLabels.has(label) && !labels.has(label)
            );
            const labelsToAdd = [...labels].filter(label => !currentLabels.includes(label));

            await Promise.all(labelsToRemove.map(label => github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              name: label
            }).catch(error => {
              if (error.status !== 404) {
                throw error;
              }
            })));

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                labels: labelsToAdd
              });
            }

            // 처음 열릴 때 담당자가 없으면 작성자를 담당자로 지정한다.
            const hasAssignees = (item.assignees || []).length > 0;
            const isBot = item.user.type === 'Bot';

            if (context.payload.action === 'opened' && !hasAssignees && !isBot) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                assignees: [author]
              });
            }
