global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: timo-prod

scrape_configs:
  - job_name: 'timo-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app-blue:8080']
        labels:
          instance: blue
      - targets: ['app-green:8080']
        labels:
          instance: green

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
