spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  oauth2:
    redirect-uri: ${FRONTEND_URL}/oauth/callback
  auth:
    cookie-secure: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expires-in-seconds: 1800
  refresh-token-expires-in-seconds: 1209600

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${AI_MODEL_NAME}
  rate-limit:
    user-rpm: ${AI_USER_RPM}
    global-rpm: ${AI_GLOBAL_RPM}
    user-rpd: ${AI_USER_RPD}
    global-rpd: ${AI_GLOBAL_RPD}
    global-tpm: ${AI_GLOBAL_TPM}

logging:
  level:
    root: INFO

sentry:
  dsn: ${SENTRY_DSN}
  environment: ${SENTRY_ENVIRONMENT:prod}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  release: ${SENTRY_RELEASE:unknown}