spring:
  application:
    name: timo-server


  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

  jackson:
    time-zone: UTC

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

app:
  oauth2:
    callback-path: /oauth/callback

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
